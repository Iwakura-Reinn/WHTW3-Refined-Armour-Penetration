<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WARHAMMER III Armour &amp; AP 2D Explorer</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  .sidebar {
    width: 365px;
    min-width: 340px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 13px 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  h1 { font-size: 16px; margin: 0 0 3px 0; color: #fff; }
  .sub { font-size: 11.5px; color: var(--muted); margin: 0; line-height: 1.4; }
  .card {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 11px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .card-title {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  label {
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  select, input[type="range"] { width: 100%; }
  select, input[type="number"] {
    background: #161b22;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 7px;
    font-size: 12px;
  }
  input[type="number"] {
    width: 76px;
    font-family: Consolas, monospace;
  }
  .range-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 12px;
  }
  .range-inputs {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .val {
    font-family: Consolas, monospace;
    color: #79c0ff;
    font-weight: 600;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    cursor: pointer;
    justify-content: flex-start;
  }
  .check-item input { width: auto; }
  .swatch {
    width: 15px;
    height: 3px;
    border-radius: 2px;
    display: inline-block;
  }
  .btn-row {
    display: flex;
    gap: 6px;
  }
  button {
    flex: 1;
    background: #21262d;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover {
    background: #30363d;
    border-color: var(--accent);
  }
  button.danger {
    border-color: #f8514966;
    color: #ffa198;
  }
  button.danger:hover {
    background: #da363322;
    border-color: #f85149;
  }
  .main {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }
  .tooltip {
    position: absolute;
    top: 14px;
    right: 18px;
    background: rgba(22, 27, 34, 0.92);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.55;
    min-width: 255px;
    pointer-events: none;
  }
  .hint {
    position: absolute;
    bottom: 10px;
    right: 16px;
    background: rgba(22, 27, 34, 0.85);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="sidebar">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">
      <div>
        <h1 id="tTitle">Armour &amp; AP 2D Explorer</h1>
        <p class="sub" id="tSub">1% step slice · Box/Wheel zoom · X/Y lock</p>
      </div>
      <div style="display:flex;gap:5px;flex-shrink:0;">
        <button id="btnLang" style="flex:0 0 auto;padding:5px 8px;">中文</button>
        <button class="danger" id="btnResetAll" style="flex:0 0 auto;padding:5px 8px;">Reset All</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title" id="tAxesTitle">Axes &amp; Slice (1% Step)</div>
      <label id="tXAxisLbl">X-Axis</label>
      <select id="xAxis">
        <option value="armour" id="optXArmour" selected>Target Armour (0 → 200)</option>
        <option value="ap" id="optXAp">AP Ratio (0% → 100%)</option>
      </select>

      <label id="tYAxisLbl">Y-Axis</label>
      <select id="yAxis">
        <option value="ehp" id="optYEhp" selected>EHP Multiplier (1 / (1 - red))</option>
        <option value="red" id="optYRed">Damage Reduction Ratio (%)</option>
        <option value="deriv" id="optYDeriv">Marginal Derivative dY/dX</option>
      </select>

      <div id="sliceApBox">
        <label><span id="tSliceAp">Fixed AP Ratio</span> <span class="val" id="vSliceAp">50%</span></label>
        <input type="range" id="sliceAp" min="0" max="100" step="1" value="50" />
      </div>
      <div id="sliceArmourBox" style="display:none">
        <label><span id="tSliceArmour">Fixed Target Armour</span> <span class="val" id="vSliceArmour">100</span></label>
        <input type="range" id="sliceArmour" min="0" max="200" step="1" value="100" />
      </div>
    </div>

    <div class="card">
      <div class="card-title" id="tZoomTitle">Zoom &amp; Axis Locks</div>
      <div class="range-row">
        <label class="check-item"><input type="checkbox" id="lockX" /><span id="tLockX">Lock X</span></label>
        <div class="range-inputs">
          <input type="number" id="xMin" step="any" value="0" />
          <span>–</span>
          <input type="number" id="xMax" step="any" value="200" />
        </div>
      </div>
      <div class="range-row">
        <label class="check-item"><input type="checkbox" id="lockY" /><span id="tLockY">Lock Y</span></label>
        <div class="range-inputs">
          <input type="number" id="yMin" step="any" value="1" />
          <span>–</span>
          <input type="number" id="yMax" step="any" value="6" />
        </div>
      </div>
      <div class="btn-row">
        <button id="btnApplyRange">Apply Range</button>
        <button id="btnResetZoom">Reset Zoom</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title" id="tParamsTitle">Parameters</div>
      <div>
        <label><span id="tGamma">gamma (AP exponent)</span> <span class="val" id="vGamma">1.30</span></label>
        <input type="range" id="gamma" min="0.50" max="2.50" step="0.05" value="1.30" />
      </div>
      <div>
        <label><span id="tLower">lower_cap (Linear roll min)</span> <span class="val" id="vLower">0.50</span></label>
        <input type="range" id="lowerCap" min="0.00" max="1.00" step="0.05" value="0.50" />
      </div>
      <div>
        <label><span id="tStep">Hyperbolic Step (S)</span> <span class="val" id="vStep">20</span></label>
        <input type="range" id="hypStep" min="5" max="150" step="5" value="20" />
      </div>
    </div>

    <div class="card">
      <div class="card-title" id="tCurvesTitle">Visible Curves</div>
      <label class="check-item"><input type="checkbox" id="cCombined" checked /><span class="swatch" style="background:#f85149"></span><span id="tCCombined">Combined: min(Linear, Hyperbolic)</span></label>
      <label class="check-item"><input type="checkbox" id="cLinear" checked /><span class="swatch" style="background:#3fb950"></span><span id="tCLinear">Refined Linear (Uncapped)</span></label>
      <label class="check-item"><input type="checkbox" id="cHyperbolic" checked /><span class="swatch" style="background:#a371f7"></span><span id="tCHyp">Hyperbolic (eff / (eff + S))</span></label>
      <label class="check-item"><input type="checkbox" id="cVanilla" checked /><span class="swatch" style="background:#58a6ff"></span><span id="tCVanilla">Vanilla WH3</span></label>
    </div>
  </div>

  <div class="main">
    <canvas id="cv"></canvas>
    <div class="tooltip" id="tip">Move mouse over chart to inspect values</div>
    <div class="hint" id="tHint">Drag box: Zoom to region · Wheel: Zoom · Double-click: Reset zoom</div>
  </div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
const el = id => document.getElementById(id);

const ML = 74, MR = 36, MT = 52, MB = 58;

let lang = 'en';
let viewX = [0, 200];
let viewY = [1, 6];
let hasCustomZoomX = false;
let hasCustomZoomY = false;

let hoverPx = -1;
let hoverPy = -1;
let dragStart = null;
let dragCur = null;

const I18N = {
  en: {
    btnLang: '中文',
    btnResetAll: 'Reset All',
    tTitle: 'Armour & AP 2D Explorer',
    tSub: '1% step slice · Box/Wheel zoom · X/Y lock',
    tAxesTitle: 'Axes & Slice (1% Step)',
    tXAxisLbl: 'X-Axis',
    optXArmour: 'Target Armour (0 → 200)',
    optXAp: 'AP Ratio (0% → 100%)',
    tYAxisLbl: 'Y-Axis',
    optYEhp: 'EHP Multiplier (1 / (1 - red))',
    optYRed: 'Damage Reduction Ratio (%)',
    optYDeriv: 'Marginal Derivative dY/dX',
    tSliceAp: 'Fixed AP Ratio',
    tSliceArmour: 'Fixed Target Armour',
    tZoomTitle: 'Zoom & Axis Locks',
    tLockX: 'Lock X',
    tLockY: 'Lock Y',
    btnApplyRange: 'Apply Range',
    btnResetZoom: 'Reset Zoom',
    tParamsTitle: 'Parameters',
    tGamma: 'gamma (AP exponent)',
    tLower: 'lower_cap (Linear roll min)',
    tStep: 'Hyperbolic Step (S)',
    tCurvesTitle: 'Visible Curves',
    tCCombined: 'Combined: min(Linear, Hyperbolic)',
    tCLinear: 'Refined Linear (Uncapped)',
    tCHyp: 'Hyperbolic (eff / (eff + S))',
    tCVanilla: 'Vanilla WH3',
    tHint: 'Drag box: Zoom to region · Wheel: Zoom · Double-click: Reset zoom',
    tipDefault: 'Move mouse over chart to inspect values',
    axArmour: 'Target Armour',
    axAp: 'AP Share (A / D)',
    yEhp: 'EHP Multiplier',
    yRed: 'Damage Reduction (%)',
    yDeriv: 'Marginal d(EHP)/dX',
    vs: 'vs',
    lblCombined: 'Combined (min)',
    lblLinear: 'Refined Linear',
    lblHyp: 'Hyperbolic',
    lblVanilla: 'Vanilla'
  },
  zh: {
    btnLang: 'EN',
    btnResetAll: '全部重置',
    tTitle: '护甲与破甲 2D 曲线工具',
    tSub: '1% 步长切片 · 框选/滚轮缩放 · X/Y 轴锁定',
    tAxesTitle: '坐标轴与切片 (1% 步长)',
    tXAxisLbl: '横轴 (X-Axis)',
    optXArmour: '目标护甲 (0 → 200)',
    optXAp: '破甲占比 AP Ratio (0% → 100%)',
    tYAxisLbl: '纵轴 (Y-Axis)',
    optYEhp: '等效生命倍率 EHP (1 / (1 - red))',
    optYRed: '减伤比例 Reduction (%)',
    optYDeriv: '边际导数 dY/dX',
    tSliceAp: '固定破甲占比',
    tSliceArmour: '固定目标护甲',
    tZoomTitle: '区间缩放与轴锁定',
    tLockX: '锁定 X',
    tLockY: '锁定 Y',
    btnApplyRange: '应用区间',
    btnResetZoom: '重置缩放',
    tParamsTitle: '算法参数',
    tGamma: 'gamma (破甲指数)',
    tLower: 'lower_cap (线性掷骰下限)',
    tStep: '双曲步长 S (Hyperbolic Step)',
    tCurvesTitle: '显示曲线',
    tCCombined: '两者结合: min(线性, 双曲)',
    tCLinear: 'Refined Linear (无上限)',
    tCHyp: '双曲公式 (eff / (eff + S))',
    tCVanilla: '原版 WH3 (Vanilla)',
    tHint: '左键框选: 缩放到指定区间 · 滚轮: 缩放 · 双击: 重置缩放',
    tipDefault: '将鼠标移至图表区域查看精确数值',
    axArmour: '目标护甲 (Target Armour)',
    axAp: '破甲占比 (AP Share)',
    yEhp: '等效生命倍率 (EHP)',
    yRed: '减伤比例 (%)',
    yDeriv: '边际导数 d(EHP)/dX',
    vs: '随',
    lblCombined: '结合 min(线性,双曲)',
    lblLinear: 'Refined 线性',
    lblHyp: '双曲公式',
    lblVanilla: '原版 Vanilla'
  }
};

function applyLang() {
  const t = I18N[lang];
  for (const k of ['btnLang','btnResetAll','tTitle','tSub','tAxesTitle','tXAxisLbl','optXArmour','optXAp','tYAxisLbl','optYEhp','optYRed','optYDeriv','tSliceAp','tSliceArmour','tZoomTitle','tLockX','tLockY','btnApplyRange','btnResetZoom','tParamsTitle','tGamma','tLower','tStep','tCurvesTitle','tCCombined','tCLinear','tCHyp','tCVanilla','tHint']) {
    el(k).textContent = t[k];
  }
  tip.textContent = t.tipDefault;
}

function expectedMinCap(a, b, cap) {
  if (b <= a) return Math.min(cap, a);
  if (b <= cap) return 0.5 * (a + b);
  if (a >= cap) return cap;
  return (((cap * cap - a * a) * 0.5) + cap * (b - cap)) / (b - a);
}

function calcRed(kind, armour, r, p) {
  if (kind === 'vanilla') {
    return (1.0 - r) * expectedMinCap(0.005 * armour, 0.01 * armour, 1.0);
  }
  const eff = armour * (1.0 - Math.pow(r, p.gamma));
  const redHyp = eff > 0 ? (eff / (eff + p.hypStep)) : 0.0;
  if (kind === 'hyperbolic') {
    return redHyp;
  }
  if (kind === 'linear') {
    return expectedMinCap(0.01 * p.lowerCap * eff, 0.01 * eff, 1.0);
  }
  // combined: E[min(roll_lin, redHyp)]
  return expectedMinCap(0.01 * p.lowerCap * eff, 0.01 * eff, redHyp);
}

function calcMetric(kind, armour, r, p, yAxis) {
  const red = calcRed(kind, armour, r, p);
  if (yAxis === 'red') return red * 100.0;
  return 1.0 / Math.max(1e-4, 1.0 - red);
}

function evalAtX(kind, xVal, xAxis, yAxis, p) {
  const armour = (xAxis === 'armour') ? xVal : p.sliceArmour;
  const r = (xAxis === 'armour') ? (p.sliceAp / 100.0) : (xVal / 100.0);
  if (yAxis !== 'deriv') {
    return calcMetric(kind, armour, r, p, yAxis);
  }
  const eps = (xAxis === 'armour') ? 0.5 : 0.25;
  const x0 = Math.max(0, xVal - eps);
  const x1 = Math.min(xAxis === 'armour' ? 200 : 100, xVal + eps);
  const a0 = (xAxis === 'armour') ? x0 : p.sliceArmour;
  const a1 = (xAxis === 'armour') ? x1 : p.sliceArmour;
  const r0 = (xAxis === 'armour') ? (p.sliceAp / 100.0) : (x0 / 100.0);
  const r1 = (xAxis === 'armour') ? (p.sliceAp / 100.0) : (x1 / 100.0);
  const e0 = calcMetric(kind, a0, r0, p, 'ehp');
  const e1 = calcMetric(kind, a1, r1, p, 'ehp');
  return (e1 - e0) / Math.max(1e-6, x1 - x0);
}

function getParams() {
  return {
    xAxis: el('xAxis').value,
    yAxis: el('yAxis').value,
    sliceAp: parseFloat(el('sliceAp').value),
    sliceArmour: parseFloat(el('sliceArmour').value),
    gamma: parseFloat(el('gamma').value),
    lowerCap: parseFloat(el('lowerCap').value),
    hypStep: parseFloat(el('hypStep').value)
  };
}

function getActiveCurves(p) {
  const t = I18N[lang];
  const activeCurves = [];
  if (el('cVanilla').checked) activeCurves.push({ kind: 'vanilla', label: t.lblVanilla, color: '#58a6ff', dash: [7, 4], width: 2.5 });
  if (el('cLinear').checked) activeCurves.push({ kind: 'linear', label: `${t.lblLinear} (g=${p.gamma.toFixed(2)})`, color: '#3fb950', dash: [4, 3], width: 2.3 });
  if (el('cHyperbolic').checked) activeCurves.push({ kind: 'hyperbolic', label: `${t.lblHyp} (S=${p.hypStep}, g=${p.gamma.toFixed(2)})`, color: '#a371f7', dash: [2, 2], width: 2.4 });
  if (el('cCombined').checked) activeCurves.push({ kind: 'combined', label: `${t.lblCombined} (S=${p.hypStep}, g=${p.gamma.toFixed(2)})`, color: '#f85149', dash: [], width: 3.0 });
  return activeCurves;
}

function syncRangeInputs() {
  el('xMin').value = Number(viewX[0].toFixed(2));
  el('xMax').value = Number(viewX[1].toFixed(2));
  el('yMin').value = Number(viewY[0].toFixed(3));
  el('yMax').value = Number(viewY[1].toFixed(3));
}

function computeAutoRanges(p, activeCurves) {
  const fullXMax = (p.xAxis === 'armour') ? 200 : 100;
  if (!el('lockX').checked && !hasCustomZoomX) {
    viewX = [0, fullXMax];
  }
  if (!el('lockY').checked && !hasCustomZoomY) {
    let yMin = (p.yAxis === 'ehp') ? 1.0 : 0.0;
    let yMax = (p.yAxis === 'red') ? 100.0 : 2.0;
    if (p.yAxis !== 'red') {
      let maxFound = (p.yAxis === 'ehp') ? 2.0 : 0.01;
      let minFound = (p.yAxis === 'ehp') ? 1.0 : 0.0;
      for (const c of activeCurves) {
        for (let i = 0; i <= 100; i++) {
          const xv = viewX[0] + (i / 100) * (viewX[1] - viewX[0]);
          const yv = evalAtX(c.kind, xv, p.xAxis, p.yAxis, p);
          if (yv > maxFound) maxFound = yv;
          if (yv < minFound) minFound = yv;
        }
      }
      yMax = Math.min(25.0, maxFound * 1.08);
      yMin = (p.yAxis === 'deriv' && minFound < 0) ? minFound * 1.08 : yMin;
    }
    viewY = [yMin, yMax];
  }
  syncRangeInputs();
}

function draw() {
  const p = getParams();
  const t = I18N[lang];
  el('sliceApBox').style.display = (p.xAxis === 'armour') ? 'block' : 'none';
  el('sliceArmourBox').style.display = (p.xAxis === 'ap') ? 'block' : 'none';
  el('vSliceAp').textContent = `${p.sliceAp}%`;
  el('vSliceArmour').textContent = `${p.sliceArmour}`;
  el('vGamma').textContent = p.gamma.toFixed(2);
  el('vLower').textContent = p.lowerCap.toFixed(2);
  el('vStep').textContent = p.hypStep.toFixed(0);

  const activeCurves = getActiveCurves(p);
  computeAutoRanges(p, activeCurves);

  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth;
  const h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) {
    cv.width = w * dpr;
    cv.height = h * dpr;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const PW = w - ML - MR;
  const PH = h - MT - MB;
  if (PW <= 50 || PH <= 50) return;

  const [xMin, xMax] = viewX;
  const [yMin, yMax] = viewY;

  const sx = x => ML + ((x - xMin) / Math.max(1e-6, xMax - xMin)) * PW;
  const sy = y => MT + PH - ((y - yMin) / Math.max(1e-6, yMax - yMin)) * PH;

  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#8b949e';
  ctx.font = '12px Segoe UI, sans-serif';

  for (let i = 0; i <= 5; i++) {
    const yv = yMin + (i / 5) * (yMax - yMin);
    const py = sy(yv);
    ctx.beginPath(); ctx.moveTo(ML, py); ctx.lineTo(ML + PW, py); ctx.stroke();
    const lbl = p.yAxis === 'red' ? `${yv.toFixed(1)}%` : (p.yAxis === 'ehp' ? `${yv.toFixed(2)}x` : yv.toFixed(3));
    ctx.textAlign = 'right';
    ctx.fillText(lbl, ML - 10, py + 4);
  }

  for (let i = 0; i <= 10; i++) {
    const xv = xMin + (i / 10) * (xMax - xMin);
    const px = sx(xv);
    ctx.beginPath(); ctx.moveTo(px, MT); ctx.lineTo(px, MT + PH); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillText(p.xAxis === 'armour' ? `${xv.toFixed(0)}` : `${xv.toFixed(0)}%`, px, MT + PH + 20);
  }

  ctx.strokeStyle = '#8b949e';
  ctx.strokeRect(ML, MT, PW, PH);

  ctx.fillStyle = '#e6edf3';
  ctx.font = '600 15px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  const yTitle = p.yAxis === 'ehp' ? t.yEhp : (p.yAxis === 'red' ? t.yRed : t.yDeriv);
  const xTitle = p.xAxis === 'armour' ? t.axArmour : t.axAp;
  const sliceTxt = p.xAxis === 'armour' ? `@ AP = ${p.sliceAp}%` : `@ Armour = ${p.sliceArmour}`;
  ctx.fillText(`${yTitle} ${t.vs} ${xTitle} (${sliceTxt})`, ML + PW / 2, 28);

  ctx.font = '13px Segoe UI, sans-serif';
  ctx.fillText(xTitle, ML + PW / 2, h - 14);

  ctx.save();
  ctx.beginPath();
  ctx.rect(ML, MT, PW, PH);
  ctx.clip();

  for (const c of activeCurves) {
    ctx.save();
    ctx.strokeStyle = c.color;
    ctx.lineWidth = c.width;
    ctx.setLineDash(c.dash);
    ctx.beginPath();
    for (let i = 0; i <= 260; i++) {
      const xv = xMin + (i / 260) * (xMax - xMin);
      const yv = evalAtX(c.kind, xv, p.xAxis, p.yAxis, p);
      const px = sx(xv), py = sy(yv);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }

  if (dragStart && dragCur) {
    const bx = Math.min(dragStart.x, dragCur.x);
    const by = Math.min(dragStart.y, dragCur.y);
    const bw = Math.abs(dragCur.x - dragStart.x);
    const bh = Math.abs(dragCur.y - dragStart.y);
    ctx.fillStyle = 'rgba(88, 166, 255, 0.16)';
    ctx.strokeStyle = '#58a6ff';
    ctx.lineWidth = 1.2;
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeRect(bx, by, bw, bh);
  }

  if (!dragStart && hoverPx >= ML && hoverPx <= ML + PW && hoverPy >= MT && hoverPy <= MT + PH) {
    const xv = xMin + ((hoverPx - ML) / PW) * (xMax - xMin);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(hoverPx, MT); ctx.lineTo(hoverPx, MT + PH); ctx.stroke();

    const lines = [`<b>${p.xAxis === 'armour' ? t.axArmour : t.axAp}:</b> ${xv.toFixed(1)}${p.xAxis === 'ap' ? '%' : ''}`];
    for (const c of activeCurves) {
      const yv = evalAtX(c.kind, xv, p.xAxis, p.yAxis, p);
      const py = sy(yv);
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.arc(hoverPx, py, 4, 0, Math.PI * 2); ctx.fill();
      const fmt = p.yAxis === 'red' ? `${yv.toFixed(2)}%` : (p.yAxis === 'ehp' ? `${yv.toFixed(2)}x` : yv.toFixed(4));
      lines.push(`<span style="color:${c.color}">●</span> ${c.label}: <b>${fmt}</b>`);
    }
    tip.innerHTML = lines.join('<br>');
  }

  ctx.restore();
}

function resetZoom() {
  hasCustomZoomX = false;
  hasCustomZoomY = false;
  el('lockX').checked = false;
  el('lockY').checked = false;
  draw();
}

function resetAll() {
  el('xAxis').value = 'armour';
  el('yAxis').value = 'ehp';
  el('sliceAp').value = 50;
  el('sliceArmour').value = 100;
  el('gamma').value = 1.30;
  el('lowerCap').value = 0.50;
  el('hypStep').value = 20;
  el('cCombined').checked = true;
  el('cLinear').checked = true;
  el('cHyperbolic').checked = true;
  el('cVanilla').checked = true;
  resetZoom();
}

el('btnLang').addEventListener('click', () => {
  lang = (lang === 'en') ? 'zh' : 'en';
  applyLang();
  draw();
});

el('btnResetZoom').addEventListener('click', resetZoom);
el('btnResetAll').addEventListener('click', resetAll);

el('btnApplyRange').addEventListener('click', () => {
  const nx0 = parseFloat(el('xMin').value);
  const nx1 = parseFloat(el('xMax').value);
  const ny0 = parseFloat(el('yMin').value);
  const ny1 = parseFloat(el('yMax').value);
  if (!isNaN(nx0) && !isNaN(nx1) && nx1 > nx0) {
    viewX = [nx0, nx1];
    hasCustomZoomX = true;
    el('lockX').checked = true;
  }
  if (!isNaN(ny0) && !isNaN(ny1) && ny1 > ny0) {
    viewY = [ny0, ny1];
    hasCustomZoomY = true;
    el('lockY').checked = true;
  }
  draw();
});

for (const id of ['xMin', 'xMax', 'yMin', 'yMax']) {
  el(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') el('btnApplyRange').click();
  });
}

el('xAxis').addEventListener('change', () => {
  if (!el('lockX').checked) hasCustomZoomX = false;
  if (!el('lockY').checked) hasCustomZoomY = false;
  draw();
});

el('yAxis').addEventListener('change', () => {
  if (!el('lockY').checked) hasCustomZoomY = false;
  draw();
});

cv.addEventListener('mousedown', e => {
  const rect = cv.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const PW = cv.clientWidth - ML - MR;
  const PH = cv.clientHeight - MT - MB;
  if (px >= ML && px <= ML + PW && py >= MT && py <= MT + PH) {
    dragStart = { x: px, y: py };
    dragCur = { x: px, y: py };
  }
});

window.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  hoverPx = e.clientX - rect.left;
  hoverPy = e.clientY - rect.top;
  if (dragStart) {
    const PW = cv.clientWidth - ML - MR;
    const PH = cv.clientHeight - MT - MB;
    dragCur = {
      x: Math.max(ML, Math.min(ML + PW, hoverPx)),
      y: Math.max(MT, Math.min(MT + PH, hoverPy))
    };
  }
  draw();
});

window.addEventListener('mouseup', () => {
  if (dragStart && dragCur) {
    const dx = Math.abs(dragCur.x - dragStart.x);
    const dy = Math.abs(dragCur.y - dragStart.y);
    if (dx > 12 && dy > 12) {
      const PW = cv.clientWidth - ML - MR;
      const PH = cv.clientHeight - MT - MB;
      const [xMin, xMax] = viewX;
      const [yMin, yMax] = viewY;
      const x0 = Math.min(dragStart.x, dragCur.x);
      const x1 = Math.max(dragStart.x, dragCur.x);
      const y0 = Math.min(dragStart.y, dragCur.y);
      const y1 = Math.max(dragStart.y, dragCur.y);

      if (!el('lockX').checked) {
        viewX = [
          xMin + ((x0 - ML) / PW) * (xMax - xMin),
          xMin + ((x1 - ML) / PW) * (xMax - xMin)
        ];
        hasCustomZoomX = true;
      }
      if (!el('lockY').checked) {
        viewY = [
          yMax - ((y1 - MT) / PH) * (yMax - yMin),
          yMax - ((y0 - MT) / PH) * (yMax - yMin)
        ];
        hasCustomZoomY = true;
      }
    }
    dragStart = null;
    dragCur = null;
    draw();
  }
});

cv.addEventListener('dblclick', resetZoom);

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const PW = cv.clientWidth - ML - MR;
  const PH = cv.clientHeight - MT - MB;
  if (px < ML || px > ML + PW || py < MT || py > MT + PH) return;

  const factor = e.deltaY > 0 ? 1.15 : 0.87;
  if (!el('lockX').checked) {
    const fx = (px - ML) / PW;
    const cx = viewX[0] + fx * (viewX[1] - viewX[0]);
    const spanX = (viewX[1] - viewX[0]) * factor;
    viewX = [cx - fx * spanX, cx + (1 - fx) * spanX];
    hasCustomZoomX = true;
  }
  if (!el('lockY').checked) {
    const fy = 1.0 - (py - MT) / PH;
    const cy = viewY[0] + fy * (viewY[1] - viewY[0]);
    const spanY = (viewY[1] - viewY[0]) * factor;
    viewY = [cy - fy * spanY, cy + (1 - fy) * spanY];
    hasCustomZoomY = true;
  }
  draw();
}, { passive: false });

for (const id of ['sliceAp', 'sliceArmour', 'gamma', 'lowerCap', 'hypStep', 'cCombined', 'cLinear', 'cHyperbolic', 'cVanilla', 'lockX', 'lockY']) {
  el(id).addEventListener('input', draw);
  el(id).addEventListener('change', draw);
}
window.addEventListener('resize', draw);
applyLang();
draw();
</script>
</body>
</html>
